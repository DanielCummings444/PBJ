services:
  cli-vm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: dev
        USER_UID: 1000
        USER_GID: 1000
    image: pbj-cli-vm:latest
    container_name: pbj-cli-vm
    hostname: cli-vm
    stdin_open: true   # -i (interactive)
    tty: true          # -t (pseudo-TTY)
    restart: unless-stopped

    volumes:
      # Mount a workspace directory from the host
      - ./workspace:/workspace

      # Mount the Docker socket so the Docker CLI inside the VM can
      # talk to the host Docker daemon (optional — remove if not needed)
      - /var/run/docker.sock:/var/run/docker.sock

      # Persist home directory for shell history, configs, etc.
      - cli-vm-home:/home/dev

    environment:
      - TZ=UTC
      - TERM=xterm-256color

    # Give the container access to the host network when needed
    # (change to "bridge" for isolated networking)
    network_mode: bridge

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  cli-vm-home:
    driver: local
