server {
    listen 8080 default_server;
    server_name _;

    # Basic auth — htpasswd file created by entrypoint.sh
    # If /etc/nginx/.htpasswd does not exist, auth is disabled
    set $auth_basic off;
    if (-f /etc/nginx/.htpasswd) {
        set $auth_basic "OpenClaw-Toolkit";
    }
    auth_basic $auth_basic;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Proxy to OpenClaw gateway
    location / {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for AI responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    # Jupyter Lab (if running on port 8888)
    location /jupyter/ {
        auth_basic $auth_basic;
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Health check endpoint (bypasses auth)
    location = /healthz {
        auth_basic off;
        return 200 '{"status":"ok","service":"openclaw-toolkit","tools":"232+"}';
        add_header Content-Type application/json;
    }
}
