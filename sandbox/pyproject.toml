[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbip-analyzer"
version = "1.0.0"
description = "Power BI Project (PBIP) analyzer MCP tool"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
]

[project.scripts]
pbip-analyzer = "pbip_analyzer.server:main"

[tool.setuptools.packages.find]
include = ["pbip_analyzer*"]
