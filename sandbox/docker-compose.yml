services:
  pbip-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: pbip-analyzer:latest
    container_name: pbip-analyzer
    stdin_open: true
    tty: true

    volumes:
      # Mount PBIP projects to analyze
      - ./projects:/data/projects

      # Output directory for generated reports
      - ./reports:/data/reports

      # Mount sample data
      - ./samples:/data/samples

    environment:
      - PYTHONUNBUFFERED=1

    # MCP servers communicate over stdio, so no ports needed
    # If you want to run the CLI tool instead, override the command:
    #   docker compose run --rm pbip-analyzer python -m pbip_analyzer.cli /data/projects/MyProject

volumes: {}
